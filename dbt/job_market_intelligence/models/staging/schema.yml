version: 2

models:
  - name: stg_canonical_jobs
    description: Source-conformed canonical job records.
    columns:
      - name: canonical_job_id
        data_tests:
          - not_null
          - unique

  - name: stg_companies
    description: Source-conformed company lookup.
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique

  - name: stg_departments
    description: Source-conformed department lookup.
    columns:
      - name: department_id
        data_tests:
          - not_null
          - unique

  - name: stg_employment_relations
    description: Source-conformed employment relation lookup.
    columns:
      - name: employment_relation_id
        data_tests:
          - not_null
          - unique

  - name: stg_job_posting_compensations
    description: One optional compensation record per source posting.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
          - unique
      - name: salary_min_czk_month
        description: Lower compensation bound normalized to CZK per month.
      - name: salary_max_czk_month
        description: Upper compensation bound normalized to CZK per month.

  - name: stg_job_posting_departments
    description: Source-conformed posting-to-department relationships.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
      - name: department_id
        data_tests:
          - not_null

  - name: stg_job_posting_employment_options
    description: Source-conformed employment options for source postings.
    columns:
      - name: employment_option_id
        data_tests:
          - not_null
          - unique
      - name: job_posting_id
        data_tests:
          - not_null

  - name: stg_job_posting_locations
    description: Source-conformed posting-to-location relationships.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
      - name: location_id
        data_tests:
          - not_null

  - name: stg_job_posting_sources
    description: Source-conformed posting-to-canonical-job relationships.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
          - unique

  - name: stg_job_posting_work_modes
    description: Source-conformed posting-to-work-mode relationships.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
      - name: work_mode_id
        data_tests:
          - not_null

  - name: stg_job_postings
    description: One source-conformed row per job posting, including the raw advertisement payload.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
          - unique

  - name: stg_job_skill_requirements
    description: Source-conformed posting-to-skill relationships and requirement parameters.
    columns:
      - name: job_posting_id
        data_tests:
          - not_null
      - name: skill_id
        data_tests:
          - not_null

  - name: stg_locations
    description: Source-conformed location lookup.
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

  - name: stg_proficiency_levels
    description: Source-conformed proficiency level lookup.
    columns:
      - name: proficiency_level_id
        data_tests:
          - not_null
          - unique

  - name: stg_requirement_types
    description: Source-conformed skill requirement type lookup.
    columns:
      - name: requirement_type_id
        data_tests:
          - not_null
          - unique

  - name: stg_roles
    description: Source-conformed role lookup.
    columns:
      - name: role_id
        data_tests:
          - not_null
          - unique

  - name: stg_seniority_levels
    description: Source-conformed seniority lookup.
    columns:
      - name: seniority_id
        data_tests:
          - not_null
          - unique

  - name: stg_skills
    description: Source-conformed skill lookup.
    columns:
      - name: skill_id
        data_tests:
          - not_null
          - unique

  - name: stg_sources
    description: Source-conformed source board lookup.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - unique

  - name: stg_work_modes
    description: Source-conformed work mode lookup.
    columns:
      - name: work_mode_id
        data_tests:
          - not_null
          - unique

  - name: stg_workloads
    description: Source-conformed workload lookup.
    columns:
      - name: workload_id
        data_tests:
          - not_null
          - unique
