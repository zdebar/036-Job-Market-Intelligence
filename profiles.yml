# Project-local dbt profile.
# Keep this file in the repository root so dbt finds it before %USERPROFILE%\.dbt.
# Credentials can be supplied through environment variables; local defaults
# match the Docker Compose development database.
job_market_intelligence:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '15433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'jmi') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'change_me_locally') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'job_market_intelligence') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
