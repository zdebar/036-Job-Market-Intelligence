[project]
name = "036-job-market-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zdebar", email = "zdebarth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
db-migrate = "job_market_intelligence.migrations:main"
db-seed = "job_market_intelligence.seeds:main"
job-market-ingest = "job_market_intelligence.ingestion.runner:main"
job-market-parse = "job_market_intelligence.processing.runner:main"
job-market-report = "job_market_intelligence.analytics.runner:report_main"
job-market-quality = "job_market_intelligence.analytics.runner:quality_main"
job-market-intelligence = "job_market_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_market_intelligence"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


